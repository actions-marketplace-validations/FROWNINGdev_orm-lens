# django-orm-lens was renamed to orm-lens in 1.16.0. This distribution keeps
# `pip install django-orm-lens` (and the [mcp] extra) working: it installs the
# newest orm-lens 1.x and adds only what carries the old name - the
# `django-orm-lens` / `django-orm-lens-mcp` commands, which print a rename
# note on stderr, and the `django_orm_lens` import path, which raises a
# DeprecationWarning. Both are thin aliases of orm-lens.
#
# Those live here and not in orm-lens on purpose. Upgrading from an old
# django-orm-lens uninstalls that release's files (its django_orm_lens/
# package and its two commands) after orm-lens is installed; files of the
# same name owned by orm-lens would be deleted with them.
#
# Since 1.17.1 the pins are a range, so this is not released with orm-lens
# any more: upload it by hand only when something here changes, and move the
# floor up only for a change it needs. cli/tests/test_manifest_sync.py checks
# that the range still admits the current orm-lens.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "django-orm-lens"
version = "1.17.1"
description = "Renamed to orm-lens: installs orm-lens and keeps the old command and import names."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "frowningdev" }]
dependencies = ["orm-lens>=1.17.1,<2"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
mcp = ["orm-lens[mcp]>=1.17.1,<2"]
full = ["orm-lens[mcp]>=1.17.1,<2"]

[project.urls]
Homepage = "https://github.com/FROWNINGdev/orm-lens"
"New package" = "https://pypi.org/project/orm-lens/"

[project.scripts]
django-orm-lens = "django_orm_lens_cli:main"
django-orm-lens-mcp = "django_orm_lens_cli:mcp_main"

[tool.setuptools]
packages = ["django_orm_lens"]
py-modules = ["django_orm_lens_cli"]
