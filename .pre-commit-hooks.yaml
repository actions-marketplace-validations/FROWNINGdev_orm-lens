# pre-commit hook definitions for orm-lens.
#
# Usage in a project's .pre-commit-config.yaml:
#
#   repos:
#     - repo: https://github.com/FROWNINGdev/orm-lens
#       rev: py-v1.18.0
#       hooks:
#         - id: orm-lens-nplusone
#         - id: orm-lens-migration-risk
#
# The hook environment installs orm-lens from PyPI (see the root
# pyproject.toml shim). Pin the analyzer itself with:
#   additional_dependencies: ["orm-lens==1.18.0"]
# A pin of `django-orm-lens==<version>` from 1.16.0 on resolves to the same
# orm-lens release. Older ones predate the `orm-lens` command, so with them
# the hook runs the newest orm-lens instead; switch the pin to orm-lens.
#
# The django-orm-lens-* ids are the pre-rename spelling. They stay so that
# existing configs keep working, run the same command, and name the id to
# switch to in their `name`, which pre-commit prints on every run.

- id: orm-lens-nplusone
  name: orm-lens · static N+1 check
  description: >-
    Flag FK/M2M access inside loops without select_related/prefetch_related.
    Static analysis — no DB, no Django boot. Exits non-zero on findings.
  entry: orm-lens nplusone --confidence high
  language: python
  pass_filenames: false
  types: [python]

- id: orm-lens-migration-risk
  name: orm-lens · migration risk check
  description: >-
    Flag migration operations that are dangerous on a production database
    (NOT NULL without default, table-locking index builds, irreversible
    data migrations, ...). Exits non-zero on critical findings.
  entry: orm-lens migration-risk
  language: python
  pass_filenames: false
  types: [python]

- id: django-orm-lens-nplusone
  name: orm-lens · static N+1 check (old id, use orm-lens-nplusone)
  description: Pre-rename id of orm-lens-nplusone.
  entry: orm-lens nplusone --confidence high
  language: python
  pass_filenames: false
  types: [python]

- id: django-orm-lens-migration-risk
  name: orm-lens · migration risk check (old id, use orm-lens-migration-risk)
  description: Pre-rename id of orm-lens-migration-risk.
  entry: orm-lens migration-risk
  language: python
  pass_filenames: false
  types: [python]
