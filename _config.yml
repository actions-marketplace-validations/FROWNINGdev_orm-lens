# Jekyll config for the GitHub Pages preview at
# https://frowningdev.github.io/orm-lens/
#
# Without this file GitHub Pages falls back to its legacy default
# renderer that does NOT process markdown inside HTML blocks. Because
# our README wraps the badge stack and hero section in
# `<div align="center">` blocks, every `![badge](...)` and `[text](url)`
# inside those divs stayed as raw text — visible to visitors and cited
# by wsvincent/awesome-django#378 reviewers as "broken markdown blocks".
#
# `parse_block_html: true` fixes that globally; the per-div
# `markdown="1"` attributes act as belt-and-suspenders in case a future
# GH-Pages Jekyll bump reverts the default.

theme: jekyll-theme-primer

# Search metadata for the GitHub Pages homepage, consumed by jekyll-seo-tag.
# Without a `title`/`tagline`/`description` the homepage `<title>` and
# `<meta name="description">` fell back to the bare repo name — so the page
# ranked only for the brand name, never for the problems people actually
# search ("django er diagram", "sqlalchemy n+1", "alembic migration linter").
# `tagline` puts those keywords into the homepage `<title>`
# ("<title> | <tagline>"); `description` carries them into the meta description.
title: ORM Lens
tagline: ER diagrams, N+1 and migration-risk linter for Django and SQLAlchemy
# Google cuts a description at about 155 characters, so this one fits in that.
# It is also the fallback for every page without its own (see defaults below).
description: >-
  Static analysis for Django and SQLAlchemy: ER diagrams, N+1 detection,
  migration and Alembic risk checks. VS Code extension, CLI and MCP server.

# Social card, consumed by jekyll-seo-tag. Without it the homepage unfurled
# as a bare `summary` card with no image anywhere it was shared.
#
# seo-tag resolves `image` off the *page*, not the site root, so setting a
# top-level `image:` key here does nothing — it has to arrive as a front
# matter default. Setting the image is also what flips the card type to
# summary_large_image, so that is not declared separately.
#
# The URL must be absolute: seo-tag's absolute_url filter does not prepend the
# project-pages baseurl, so a root-relative path would resolve off-site.
defaults:
  - scope:
      path: ""
    values:
      image: https://frowningdev.github.io/orm-lens/media/hero.png
  # README.md is served twice: as the homepage and again as /README.html. Both
  # point their canonical at the homepage so search engines treat them as one
  # page instead of two competing duplicates.
  - scope:
      path: "README.md"
    values:
      canonical_url: https://frowningdev.github.io/orm-lens/
  # README.md files under docs/rules and compat are served twice as well
  # (as the directory index and as README.html); same fix.
  - scope:
      path: "compat/django-orm-lens/README.md"
    values:
      canonical_url: https://frowningdev.github.io/orm-lens/compat/django-orm-lens/
  # The rule pages have no front matter (GitHub would render it as a table
  # at the top of the file), so their <title> came from the heading and
  # every one of them shared the site description above. Each gets its own
  # here; the long-form pages also get a title in the words people search.
  - scope:
      path: "docs/rules/DOL001.md"
    values:
      description: "DOL001: qs.count() > 0 counts every matching row; .exists() stops at the first. Why the rewrite is safe, with Django examples and a QuickFix."
  - scope:
      path: "docs/rules/DOL002.md"
    values:
      description: "DOL002: qs.count() == 0 counts every row just to compare it with zero; not qs.exists() asks for one row. Django examples and a QuickFix."
  - scope:
      path: "docs/rules/DOL003.md"
    values:
      description: "DOL003: qs.first() is None fetches and hydrates a full row only to throw it away. Use not qs.exists() unless you need the object."
  - scope:
      path: "docs/rules/DOL004.md"
    values:
      description: "DOL004: qs.first() is not None loads a whole model instance to test existence; .exists() transfers only the answer. Django examples and a QuickFix."
  - scope:
      path: "docs/rules/DOL005.md"
    values:
      description: "DOL005: a .filter().exclude() chain can collapse into one .filter(Q(...) & ~Q(...)) that states the whole predicate. A Django readability rule."
  - scope:
      path: "docs/rules/DOL006.md"
    values:
      description: "DOL006: for x in list(qs) evaluates the whole Django QuerySet and allocates an extra list before the loop starts. Iterate the queryset directly."
  - scope:
      path: "docs/rules/DOL007.md"
    values:
      description: "DOL007: an attribute access inside a for-loop over a Django queryset can fire one query per row. How to spot the N+1 and fix it."
  - scope:
      path: "docs/rules/DOL008.md"
    values:
      description: "DOL008: catches misspelled field names in Django lookups such as filter(titel=...) and suggests the right name with a QuickFix."
  - scope:
      path: "docs/rules/DOL011.md"
    values:
      description: "DOL011: null=True on a Django CharField or TextField gives the column two empty values, NULL and ''. Why Django advises against it."
  - scope:
      path: "docs/rules/DOL013.md"
    values:
      description: "DOL013: a ForeignKey or OneToOneField without on_delete raises TypeError when the model loads. Catch it while typing, with a QuickFix."
  - scope:
      path: "docs/rules/DOL014.md"
    values:
      description: "DOL014: a Django CharField without max_length fails the system checks at load time. Catch it in the editor before makemigrations."
  - scope:
      path: "docs/rules/DOL015.md"
    values:
      description: "DOL015: max_length on a Django TextField is enforced only by the form widget, never by the database. Why it reads like a limit and is not one."
  - scope:
      path: "docs/rules/DOL021.md"
    values:
      description: "DOL021: datetime.now() returns a naive datetime; under USE_TZ=True Django warns on save and raises TypeError on comparison. Use timezone.now()."
  - scope:
      path: "docs/rules/DOL022.md"
    values:
      description: "DOL022: datetime.utcnow() is deprecated since Python 3.12 and returns a naive datetime despite its name. The aware replacement for Django."
  - scope:
      path: "docs/rules/DOL031.md"
    values:
      description: "DOL031: render(request, template, locals()) leaks every local variable of a Django view into the template. Pass an explicit context."
  - scope:
      path: "docs/rules/DOL032.md"
    values:
      description: "DOL032: fields = '__all__' in a ModelForm or ModelAdmin Meta exposes every model field for writing, including ones added later."
  - scope:
      path: "docs/rules/DOL041.md"
    values:
      description: "DOL041: flags SET of Postgres planner settings (enable_*, plan_cache_mode, jit) in application code, where they outlive the query they were meant for."
  - scope:
      path: "docs/rules/README.md"
    values:
      canonical_url: https://frowningdev.github.io/orm-lens/docs/rules/
      title: "Django ORM lint rules reference"
      description: "Every ORM Lens rule for Django code: queryset performance, model fields, datetime and security checks, plus N+1, migration and Alembic risk."
  - scope:
      path: "docs/rules/alembic.md"
    values:
      title: "Alembic migration risk checks (preview)"
      description: "Static risk checks for Alembic revisions: NOT NULL columns, table-locking indexes, drops and renames that break a populated database."
  - scope:
      path: "docs/rules/drift.md"
    values:
      title: "Django schema drift check: models vs migrations"
      description: "Do your Django migrations still describe your models? orm-lens drift compares them statically, without a database, ready for CI."
  - scope:
      path: "docs/rules/migrations.md"
    values:
      title: "Django migration risk linter: 16 rules"
      description: "Static checks for dangerous Django migrations: NOT NULL without default, table-locking index builds, irreversible RunPython. No DB needed."
  - scope:
      path: "docs/rules/nplusone.md"
    values:
      title: "Static N+1 query detector for Django"
      description: "Find Django N+1 queries without running the app: a static detector for querysets looped without select_related or prefetch_related."
  - scope:
      path: "docs/rules/sqlalchemy.md"
    values:
      title: "SQLAlchemy models: ER diagrams and N+1 (preview)"
      description: "ER diagrams, model listing and N+1 detection for SQLAlchemy 2.0, Flask-SQLAlchemy and SQLModel models, read statically. Nothing is imported."

# jekyll-sitemap publishes /sitemap.xml, the file search consoles take to
# discover and recrawl the site. jekyll-seo-tag is named explicitly rather than
# left to arrive as a dependency of the theme.
# Ownership proof for Google Search Console; jekyll-seo-tag renders it as the
# google-site-verification meta tag. Removing it unverifies the property.
webmaster_verifications:
  google: oIa9kh4gq9UEbkoSisvXaKhvzQsEkjzPncVDwkFtdD8

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  parse_block_html: true
  parse_span_html: true
  syntax_highlighter: rouge

# Only publish the README as the docs preview — keep the source tree
# out of the Jekyll site so it does not accidentally rebuild every
# markdown file under `docs/` or `src/`.
include:
  - README.md
exclude:
  - node_modules
  - out
  - src
  - test
  - scripts
  - cli
  # docs/rules is published: each page answers a query people search for, and
  # the README links into it. Two pages stay out because they quote `{{ ... }}`
  # (a Django template, a GitHub Actions expression) that Liquid would silently
  # blank out; links to them point at GitHub instead.
  - docs/i18n
  - docs/rules/DOL012.md
  - docs/rules/blast-radius.md
  - Dockerfile
  - package.json
  - package-lock.json
  - tsconfig.json
  - smithery.yaml
  - CHANGELOG.md
