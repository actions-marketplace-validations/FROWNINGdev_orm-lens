name: Publish Python package to PyPI

on:
  push:
    tags:
      - 'py-v*'
  workflow_dispatch:

# Publishes orm-lens (cli/). The pre-rename django-orm-lens package
# (compat/django-orm-lens/) depends on orm-lens>=1.17.1,<2 and so follows
# every 1.x release on its own; it is not built here, and is uploaded by hand
# on the rare change to it.
#
# OIDC - GitHub mints a short-lived token per run that PyPI verifies through
# its Trusted Publisher config. See https://docs.pypi.org/trusted-publishers/
#
# PyPI-side setup (one-time), owner=FROWNINGdev, repo=orm-lens,
# workflow=publish-pypi.yml, environment=pypi:
#   https://pypi.org/manage/project/orm-lens/settings/publishing/
# PyPI matches on the repository name, so a publisher created before the
# rename (repo=django-orm-lens) no longer applies.
#
# A release can also be uploaded by hand with twine first. The step below
# then sees the version already on PyPI and skips the upload, so the rest
# of the release (release page, MCP Registry, container) still runs.
permissions:
  contents: write   # the Release step below creates the tag's release page
  id-token: write   # required for OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build orm-lens
        run: |
          python -m build cli --outdir dist
          ls -l dist

      - name: twine check
        run: python -m twine check dist/*

      - name: Skip the upload if this version is already on PyPI
        id: onpypi
        run: |
          VER="$(python -c "import tomllib; print(tomllib.load(open('cli/pyproject.toml','rb'))['project']['version'])")"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/orm-lens/${VER}/json")
          echo "orm-lens==${VER}: HTTP ${code}"
          if [ "$code" = "200" ]; then echo "skip=true"; else echo "skip=false"; fi >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI (OIDC trusted publisher)
        if: steps.onpypi.outputs.skip != 'true'
        # Pin to a full commit SHA (v1.13.0) so a poisoned tag push cannot
        # silently swap the action. Bump manually - Dependabot will notify.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist
          skip-existing: true

      # py-v1.7.0, 1.7.1, 1.8.0 and 1.8.1 all published to every registry and
      # left no GitHub release page behind, because nothing here ever made one.
      # Anyone reading the Releases tab saw py-v1.6.0 as the newest Python
      # version for a week. The notes come from the tag's own CHANGELOG
      # section, so the release page cannot describe something other than what
      # shipped.
      - name: Release notes from CHANGELOG
        id: notes
        # Title: the section's "> headline" line, else its first bold bullet.
        # Shared with publish.yml - see scripts/release_notes.py.
        run: python scripts/release_notes.py "$TAG"
        env:
          TAG: ${{ github.ref_name }}

      - name: Create the GitHub release page
        # Idempotent on purpose: a re-run of a partially failed publish must not
        # fail here just because the page already exists.
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $TAG already exists - leaving it alone"
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag \
              --title "$TITLE" --notes-file release-notes.md
          fi
        env:
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.notes.outputs.title }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
