# Root-level shim so `pre-commit` can install this repository as a hook
# environment — pre-commit always runs `pip install .` against the repo
# root, and the real distribution lives in cli/pyproject.toml (published
# to PyPI as `orm-lens`).
#
# This shim ships no code. It only depends on the published package so the
# `orm-lens` entry point resolves inside the hook venv. Pin the
# analyzer version from your .pre-commit-config.yaml with:
#
#   additional_dependencies: ["orm-lens==<version>"]
#
# Contributors: to work on the actual package, `pip install -e cli/[dev]`.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orm-lens-hooks"
version = "0.0.0"
description = "pre-commit hook shim for orm-lens (the real package lives in cli/)"
requires-python = ">=3.9"
# The hooks run the `orm-lens` command, so the hook environment needs
# orm-lens itself. An `additional_dependencies` pin of `orm-lens==<version>`
# or of `django-orm-lens==<version>` (1.16.0+, which pins orm-lens) narrows
# it to that release; see .pre-commit-hooks.yaml.
dependencies = ["orm-lens"]

[tool.setuptools]
packages = []
